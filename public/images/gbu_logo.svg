<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a6b3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d9e5f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16a34a;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- White circle background -->
  <circle cx="50" cy="50" r="48" fill="white" stroke="#e2e8f0" stroke-width="2"/>
  <!-- Shield shape -->
  <path d="M50 12 L82 24 L82 52 Q82 72 50 88 Q18 72 18 52 L18 24 Z" fill="url(#shieldGrad)" opacity="0.9"/>
  <!-- Inner shield highlight -->
  <path d="M50 20 L76 30 L76 52 Q76 68 50 82 Q24 68 24 52 L24 30 Z" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
  <!-- Leaf / Lotus symbol -->
  <path d="M50 65 Q38 55 38 44 Q44 50 50 48 Q56 50 62 44 Q62 55 50 65Z" fill="url(#leafGrad)"/>
  <path d="M50 65 Q42 50 35 40 Q44 46 50 48Z" fill="#16a34a" opacity="0.7"/>
  <path d="M50 65 Q58 50 65 40 Q56 46 50 48Z" fill="#16a34a" opacity="0.7"/>
  <!-- Stem -->
  <line x1="50" y1="65" x2="50" y2="75" stroke="#22c55e" stroke-width="2" stroke-linecap="round"/>
  <!-- GBU Text -->
  <text x="50" y="87" font-family="Georgia, serif" font-size="9" font-weight="bold" fill="#1a6b3c" text-anchor="middle" letter-spacing="2">GBU</text>
  <!-- Top arc text area -->
  <path id="topArc" d="M 22 40 A 30 30 0 0 1 78 40" fill="none"/>
  <text font-family="Arial, sans-serif" font-size="5.5" fill="white" font-weight="bold" letter-spacing="0.5">
    <textPath href="#topArc" startOffset="12%">GAUTAM BUDDHA</textPath>
  </text>
</svg>
